name: Temporary voice join regression check

on:
  push:
    branches:
      - ci/verify-voice-joins

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WPF application
        run: dotnet build src/BadWolfVoiceAlarm/BadWolfVoiceAlarm/BadWolfVoiceAlarm.csproj --configuration Release
      - name: Voice transition regression checks
        run: dotnet run --project tests/BadWolfVoiceAlarm.LogicChecks/BadWolfVoiceAlarm.LogicChecks.csproj --configuration Release
