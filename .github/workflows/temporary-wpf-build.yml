name: Temporary WPF build verification
on:
  push:
    branches:
      - ci/verify-combobox-contrast
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build application
        run: dotnet build src/BadWolfVoiceAlarm/BadWolfVoiceAlarm/BadWolfVoiceAlarm.csproj --configuration Release
